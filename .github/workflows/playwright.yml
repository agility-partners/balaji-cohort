name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SQL_SERVER_PASS: ${{ secrets.SQL_SERVER_PASS }}
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8080

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start backend stack (sqlserver + backend)
        run: docker compose up -d sqlserver backend

      - name: Wait for backend API
        run: npx wait-on@7.2.0 http://127.0.0.1:8080/api/coins

      # In CI, run one ingestion immediately so SQLServer has data.
      - name: Ingest data once
        run: docker compose run --rm data-ingestion python coingecko_ingest.py

      - name: Start frontend
        run: |
          npm run dev -- --port 3000 > frontend.log 2>&1 &
          npx wait-on@7.2.0 http://127.0.0.1:3000

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload backend/frontend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            frontend.log
          retention-days: 7

      - name: Dump docker logs (always)
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color > docker-compose.log || true

      - name: Upload docker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: docker-compose.log
          retention-days: 7

      - name: Teardown
        if: always()
        run: docker compose down -v
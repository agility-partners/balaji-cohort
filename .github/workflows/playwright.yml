name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SQL_SERVER_PASS: ${{ secrets.SQL_SERVER_PASS }}
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8080

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start backend + SQL Server
        run: docker compose up -d sqlserver backend

      - name: Wait for backend process (port open)
        run: npx -y wait-on@7.2.0 --timeout 120000 tcp:127.0.0.1:8080

      - name: Wait for SQL Server TCP port
        run: npx -y wait-on@7.2.0 --timeout 240000 tcp:127.0.0.1:1433

      - name: Wait for SQL Server login readiness
        run: |
          for i in {1..24}; do
            if docker compose run --rm dbt-scheduler dbt debug --target dev --project-dir /app/crypto_dbt --profiles-dir /root/.dbt >/tmp/dbt-debug.log 2>&1; then
              echo "SQL Server is ready for login"
              exit 0
            fi
            echo "SQL login not ready yet (attempt $i/24), retrying in 10s..."
            sleep 10
          done
          echo "SQL Server never became login-ready"
          docker compose ps
          docker compose logs --no-color sqlserver || true
          cat /tmp/dbt-debug.log || true
          exit 1

      - name: Ingest data once (bronze)
        run: docker compose run --rm data-ingestion python coingecko_ingest.py

      - name: Build dbt silver/gold once (retry)
        run: |
          for i in {1..3}; do
            if docker compose run --rm dbt-scheduler dbt run --select silver.stg_market_data gold.coins_current --project-dir /app/crypto_dbt --profiles-dir /root/.dbt; then
              exit 0
            fi
            echo "dbt run failed (attempt $i/3), waiting 20s before retry..."
            sleep 20
          done
          docker compose ps
          docker compose logs --no-color sqlserver || true
          exit 1

      - name: Wait for API data endpoint
        run: npx -y wait-on@7.2.0 --timeout 180000 http-get://127.0.0.1:8080/api/coins

      - name: Run Playwright tests
        run: npx playwright test

      - name: Dump docker logs (always)
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color > docker-compose.log || true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload docker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: docker-compose.log
          retention-days: 7

      - name: Teardown
        if: always()
        run: docker compose down -v